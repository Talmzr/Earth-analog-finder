<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Analog Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#2a303a; --text:#e6e9ee; --muted:#98a2b3; --accent:#7cc4ff;
          --good:#3fb97a; --mid:#e0b341; --bad:#d9534f; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f8; --panel:#ffffff; --line:#d9dde3; --text:#1b1f24; --muted:#5b6573; --accent:#0b62c4; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; max-width:100%; }
  label { color:var(--muted); font-size:12px; display:flex; flex-direction:column; gap:3px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; height:calc(100vh - 62px); }
  #map { min-height:320px; background:#0b0d11; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:14px 16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 8px; }
  h2:first-child { margin-top:0; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
  .facts div span { color:var(--muted); display:block; font-size:11px; }
  ol { margin:0; padding:0; list-style:none; }
  ol li { padding:7px 0; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  ol li:hover { color:var(--accent); }
  .score { font-variant-numeric:tabular-nums; font-weight:600; }
  .bar { display:grid; grid-template-columns:150px 1fr 44px; gap:8px; align-items:center; margin:3px 0; font-size:12.5px; }
  .track { height:8px; background:var(--line); border-radius:4px; position:relative; }
  .track i { position:absolute; top:0; bottom:0; border-radius:4px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11.5px; margin:2px 3px 2px 0; border:1px solid var(--line); }
  .good { color:var(--good); } .mid { color:var(--mid); } .bad { color:var(--bad); }
  small, .muted { color:var(--muted); }
  .legend { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); }
  details { margin:4px 0; } summary { cursor:pointer; }
  details ul { margin:4px 0 8px 16px; padding:0; color:var(--muted); font-size:12.5px; }
  table.q { width:100%; border-collapse:collapse; font-size:12px; } table.q td, table.q th { padding:3px 4px; border-bottom:1px solid var(--line); text-align:left; }
  table.q th { color:var(--muted); font-weight:500; }
  .legend b { width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg,#d9534f,#e0b341,#3fb97a); display:inline-block; }
  @media (max-width: 860px) { main { grid-template-columns:1fr; height:auto; } #map { height:55vh; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Earth Analog Finder</h1>
  <label>Moon target <select id="target"></select></label>
  <label>Colour Earth by <select id="cat"></select></label>
  <div class="legend">avoid <b></b> sufficient</div>
</header>
<main>
  <div id="map"></div>
  <aside>
    <h2>Moon target</h2><div id="tinfo" class="facts"></div>
    <h2>Selected Earth location</h2><div id="tile" class="muted">Click a dot on the map or a row below.</div>
    <h2>Top Earth analogs</h2><ol id="top"></ol>
    <h2>Earth can never reproduce</h2><div id="caveats" class="muted"></div>
    <h2>How reliable are the scores</h2><div id="quality"></div>
    <p><small id="note"></small></p>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const colour = v => { if (v == null) return '#555c66'; const t = Math.max(0, Math.min(1, (v + 100) / 200));
  const a = t < .5 ? [217,83,79] : [224,179,65], b = t < .5 ? [224,179,65] : [63,185,122], u = t < .5 ? t * 2 : (t - .5) * 2;
  return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * u)).join(',')})`; };
const cls = v => v == null ? 'muted' : v >= 50 ? 'good' : v >= 0 ? 'mid' : 'bad';
const fmt = v => v == null ? 'n/a' : (v / 100).toFixed(2);
let meta, targets, tiles, cur, markers = [], sel = null;
const map = L.map('map', { preferCanvas: true, worldCopyJump: true }).setView([20, 10], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 11, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

async function load() {
  [meta, targets, tiles] = await Promise.all(['meta', 'moon_targets', 'earth_tiles'].map(f => fetch(`data/${f}.json`).then(r => r.json())));
  $('target').innerHTML = targets.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  $('cat').innerHTML = `<option value="composite">Overall (weighted by relevant experiments)</option>` +
    meta.categories.map(c => `<option value="${c.id}">${c.label}</option>`).join('') +
    `<option value="thermal_pct">Temperature: closest approach (rank among Earth sites)</option>`;
  $('caveats').innerHTML = meta.earth_cannot_reproduce.map(c => `<span class="tag" title="Moon: ${c.moon}. Best on Earth: ${c.earth_best}. Cover with: ${c.cover_with}">${c.condition}</span>`).join('');
  $('quality').innerHTML = `<table class="q"><tr><th>Category</th><th>Anchors</th><th>Rank agreement</th><th>Mean error</th></tr>` +
    meta.categories.map(c => `<tr title="${c.how}"><td>${c.label}</td><td>${c.n_anchors}</td><td>${c.anchor_rank_agreement ?? 'n/a'}</td><td>${c.anchor_mae_leave_one_out ?? 'n/a'}</td></tr>`).join('') +
    `</table><small>Checked against draft expert judgements (leave-one-out error). Hover a row for the method.</small>`;
  $('note').textContent = meta.limitations[0];
  const r = L.canvas({ padding: .5 });
  markers = tiles.id.map((id, i) => L.circleMarker([tiles.lat[i], tiles.lon[i]], { renderer: r, radius: 4, weight: 0, fillOpacity: .85 })
    .on('click', () => showTile(i)).addTo(map));
  $('target').onchange = pick; $('cat').onchange = paint;
  await pick();
}
async function pick() {
  const t = targets.find(x => x.id === $('target').value);
  cur = await fetch(`data/scores/${t.id}.json`).then(r => r.json());
  const f = (k, v) => `<div><span>${k}</span>${v ?? 'n/a'}</div>`;
  $('tinfo').innerHTML = f('Type', t.kind === 'zone' ? t.zone + ' zone' : 'target tile') + f('Lat, lon', `${t.lat}, ${t.lon}`) +
    f('Slope', t.slope_deg + '°') + f('Temp min / max', `${t.temp_min_k} / ${t.temp_max_k} K`) +
    f('Permanently shadowed', t.shadowed_frac == null ? 'n/a' : Math.round(t.shadowed_frac * 100) + '%') +
    f('Ice stable within 1 m', Math.round(t.ice_within_1m_frac * 100) + '%') + f('Landing to ice', t.landing_to_ice_km ? t.landing_to_ice_km + ' km' : 'n/a') +
    f('Map unit', t.geology_unit);
  $('top').innerHTML = cur.top.slice(0, 20).map(x => `<li data-i="${x.tile}"><span>${x.rank}. ${x.name || x.id}<br><small>${x.stratum.replaceAll('_', ' ')} · ${x.lat}, ${x.lon}</small></span>
    <span class="score ${cls(x.composite * 100)}">${x.composite.toFixed(2)}</span></li>`).join('');
  $('top').querySelectorAll('li').forEach(li => li.onclick = () => { const i = +li.dataset.i; map.setView([tiles.lat[i], tiles.lon[i]], 6); showTile(i); });
  paint(); if (sel != null) showTile(sel);
}
function paint() {
  const c = $('cat').value;
  const arr = c === 'composite' ? cur.composite : c === 'thermal_pct' ? (cur.percentile?.thermal || []).map(v => v == null ? null : v * 2 - 100) : cur.scores[c];
  markers.forEach((m, i) => m.setStyle({ fillColor: colour(arr[i]), radius: i === sel ? 7 : 4 }));
}
function showTile(i) {
  sel = i; paint();
  const bars = meta.categories.map(c => { const v = cur.scores[c.id][i]; const w = v == null ? 0 : Math.abs(v) / 2;
    const pct = c.id === 'thermal' && cur.percentile?.thermal ? cur.percentile.thermal[i] : null;
    const lab = pct == null ? c.label : `${c.label}<br><small>closer than ${pct}% of Earth sites</small>`;
    return `<div class="bar"><span>${lab}</span><span class="track"><i style="left:${v == null || v >= 0 ? 50 : 50 - w}%;width:${w}%;background:${colour(v)}"></i></span>
      <span class="score ${cls(v)}">${fmt(v)}</span></div>`; }).join('');
  const names = Object.fromEntries(meta.experiments.map(e => [e.id, e.name]));
  const by = code => Object.entries(cur.readiness).filter(([, a]) => a[i] === code).map(([k]) => names[k]);
  const tags = (l, k) => l.length ? l.map(n => `<span class="tag ${k}">${n}</span>`).join('') : '<span class="muted">none</span>';
  const exps = Object.fromEntries(meta.experiments.map(e => [e.name, e]));
  const advice = l => l.map(n => `<details><summary>${n}</summary><ul>${(exps[n].also_account_for || []).map(a => `<li>${a}</li>`).join('')}</ul></details>`).join('');
  $('tile').innerHTML = `<b>${tiles.name[i] || tiles.id[i]}</b><br><small>${tiles.stratum[i].replaceAll('_', ' ')} · ${tiles.lat[i]}, ${tiles.lon[i]}
    · relief ${tiles.relief_m[i]} m · ${tiles.temp_min_k[i] ?? '?'}–${tiles.temp_max_k[i] ?? '?'} K${tiles.rock[i] ? ' · ' + tiles.rock[i] : ''}</small>
    <div style="margin:8px 0">${bars}</div><div><small>Sufficient for</small><br>${tags(by(3), 'good')}</div>
    <div><small>Partial (check weak categories)</small><br>${tags(by(2), 'mid')}</div><div><small>Avoid for</small><br>${tags(by(1), 'bad')}</div>
    ${by(3).length + by(2).length ? `<div style="margin-top:8px"><small>Also account for (open an experiment)</small>${advice([...by(3), ...by(2)])}</div>` : ''}`;
}
load().catch(e => { document.querySelector('aside').innerHTML = `<p>Could not load data: ${e}. Serve this folder over HTTP (for example <code>python -m http.server</code> in <code>web/</code>).</p>`; });
</script>
</body>
</html>
